name: Build Windows installer

on:
  push:
    branches:
      - main
      - python
      - feature/supabase-sync
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install refreshes package-lock.json for Electron 43.x,
      # the final Electron line that provides Windows x86 (ia32) builds.
      - name: Install dependencies
        run: npm install

      - name: Build Windows installers (64-bit and 32-bit)
        run: npm run build:windows

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: chiaplast-windows-installers
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
